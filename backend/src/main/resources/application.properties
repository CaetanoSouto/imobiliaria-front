spring.application.name=demo

#banco config
# MySQL em localhost:3306. O banco "imobiliaria" é criado sozinho se não existir.
# Usuário e senha podem ser trocados por variáveis de ambiente DB_USER e DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/imobiliaria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

#JPA / Hibernate config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#email
# Os e-mails (ex.: aviso de contrato aprovado) só são enviados se MAIL_USER estiver preenchido.
# Configure por variáveis de ambiente: MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASSWORD, MAIL_FROM.
spring.mail.host=${MAIL_HOST:smtp.mailgun.org}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@imobiliaria.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

#gemini
# Preencha com sua chave real antes de usar o endpoint de Gemini
# gemini.api.key=
gemini.model=gemini-3.8-flash

app.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#jwt
# Chave secreta usada para assinar o token. O valor padrao abaixo e PUBLICO (esta no GitHub):
# serve so para desenvolvimento. Em qualquer uso real, defina a variavel de ambiente JWT_SECRET
# com uma chave longa e aleatoria.
jwt.secret=${JWT_SECRET:chave-publica-so-para-desenvolvimento-nao-use-em-producao}
# tempo de validade do token em milissegundos (3600000 = 1 hora)
jwt.expiration=3600000
