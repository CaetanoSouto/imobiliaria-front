<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${aviso.assunto}">Aviso</title>
</head>
<!--/*
  E-mail de aviso ao cliente. Os estilos ficam "inline" de propósito: Gmail e Outlook ignoram
  as tags de estilo e as classes. O layout é feito com tabelas porque é o que todos os leitores
  de e-mail entendem. Estes comentários não vão dentro do e-mail enviado.
*/-->
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

    <!--/* texto de prévia que aparece na lista de e-mails, ao lado do assunto */-->
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f3f4f6;font-size:1px;line-height:1px;"
         th:text="${aviso.titulo}">Prévia</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background-color:#f3f4f6;">
        <tr>
            <td align="center" style="padding:28px 12px;">

                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                       style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:16px;border-collapse:separate;overflow:hidden;">

                    <!--/* cabeçalho com a marca */-->
                    <tr>
                        <td style="background-color:#0b0c0e;padding:22px 32px;border-bottom:3px solid #d9a441;">
                            <span style="font-size:22px;font-weight:700;letter-spacing:0.02em;color:#d9a441;" th:text="${marca}">Habitare</span>
                            <span style="font-size:22px;font-weight:400;color:#9ca3af;"> Imóveis</span>
                        </td>
                    </tr>

                    <!--/* selo, título e saudação */-->
                    <tr>
                        <td style="padding:32px 32px 4px 32px;">
                            <span style="display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;"
                                  th:style="'display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background-color:' + ${aviso.corFundo} + ';color:' + ${aviso.corTexto} + ';'"
                                  th:text="${aviso.selo}">Selo</span>
                            <h1 style="margin:18px 0 6px 0;font-size:24px;line-height:1.3;font-weight:700;color:#111827;"
                                th:text="${aviso.titulo}">Título</h1>
                            <p style="margin:0;font-size:16px;line-height:1.6;color:#4b5563;"
                               th:text="${aviso.saudacao}">Olá!</p>
                        </td>
                    </tr>

                    <!--/* parágrafos */-->
                    <tr>
                        <td style="padding:12px 32px 4px 32px;">
                            <p th:each="paragrafo : ${aviso.paragrafos}"
                               style="margin:0 0 14px 0;font-size:15px;line-height:1.65;color:#374151;"
                               th:text="${paragrafo}">Texto do aviso.</p>
                        </td>
                    </tr>

                    <!--/* quadro com os dados do imóvel / contrato */-->
                    <tr th:if="${!#lists.isEmpty(aviso.detalhes)}">
                        <td style="padding:8px 32px 8px 32px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                   style="background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;border-collapse:separate;">
                                <tr th:each="d : ${aviso.detalhes}">
                                    <td valign="top" width="36%"
                                        style="padding:11px 16px;font-size:13px;line-height:1.5;color:#6b7280;border-bottom:1px solid #eceef1;"
                                        th:text="${d.rotulo}">Imóvel</td>
                                    <td valign="top"
                                        style="padding:11px 16px;font-size:14px;line-height:1.5;font-weight:600;color:#111827;border-bottom:1px solid #eceef1;"
                                        th:text="${d.valor}">Casa 3 dormitórios</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!--/* botão */-->
                    <tr th:if="${link != null}">
                        <td align="center" style="padding:22px 32px 8px 32px;">
                            <a href="#" th:href="${link}"
                               style="display:inline-block;background-color:#d9a441;color:#1a1305;font-size:15px;font-weight:700;text-decoration:none;padding:14px 32px;border-radius:10px;"
                               th:text="${aviso.botaoTexto}">Abrir</a>
                        </td>
                    </tr>

                    <!--/* rodapé */-->
                    <tr>
                        <td style="padding:28px 32px 30px 32px;">
                            <hr style="border:none;border-top:1px solid #e5e7eb;margin:0 0 18px 0;">
                            <p style="margin:0 0 4px 0;font-size:13px;line-height:1.6;color:#6b7280;">
                                Atenciosamente,<br>
                                <strong style="color:#374151;"><span th:text="${marca}">Habitare</span> Imóveis</strong>
                            </p>
                            <p style="margin:14px 0 0 0;font-size:12px;line-height:1.6;color:#9ca3af;">
                                Este é um aviso automático. Em caso de dúvidas, entre em contato com a imobiliária.
                            </p>
                        </td>
                    </tr>
                </table>

                <p style="margin:16px 0 0 0;font-size:12px;color:#9ca3af;">
                    © <span th:text="${ano}">2026</span> <span th:text="${marca}">Habitare</span> Imóveis
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
